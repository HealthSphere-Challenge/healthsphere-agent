[project]
name = "healthsphere-agent"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.119.0",
  "httpx==0.28.1",
  "pydantic-settings==2.11.0",
  "uvicorn[standard]==0.37.0",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "scripts"]

[project.scripts]
healthsphere-build-index = "scripts.build_medquad_index:main"
healthsphere-evaluate-retrieval = "scripts.evaluate_retrieval:main"
healthsphere-evaluate-agent = "scripts.evaluate_agent:main"

[dependency-groups]
dev = ["pytest==8.4.2", "pytest-asyncio==1.2.0", "ruff==0.14.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["E501", "S101", "S105"]
